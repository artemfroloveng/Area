<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header container">
        <div class="header__inner">
            <a href="#" class="header__logo">
                <p>Area</p>
            </a>

            <nav class="header__menu mobile-hidden">
                <ul class="header__menu-list">
                    <li class="header__menu-item">
                        <a href="header__menu-link">Benefits</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="header__menu-link">Specifications</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="header__menu-link">How-to</a>
                    </li>
                    <li class="header__menu-item">
                        <a href="header__menu-link">Contact Us</a>
                    </li>
                </ul>
            </nav>

            <button class="header__button mobile-hidden">Learn More</button>


            <input type="checkbox" id="menu-toggle" class="header__toggle visually-hidden">

            <label for="menu-toggle" class="header__burger mobile-only" aria-label="Menu">
                <span class="header__burger-line"></span>
                <span class="header__burger-line"></span>
                <span class="header__burger-line"></span>
            </label>

            <nav class="header__mobile-menu mobile-only">
                <ul>
                    <li>
                        <a href="#">Benefits</a>
                    </li>
                    <li>
                        <a href="#">Specifications</a>
                    </li>
                    <li>
                        <a href="#">How-to</a>
                    </li>
                    <li>
                        <a href="#">Contact Us</a>
                    </li>
                </ul>

                <button class="header__burger-button">Learn More</button>
            </nav>
        </div>
    </header>


    <main>
        <section class="browse container">
            <h1 class="browse__title">Browse everything.</h1>
            <picture class="browse__image">
                <source media="(max-width: 767px)"  srcset="assets/images/Mobile.png">
                <source media="(max-width: 1023px)" srcset="assets/images/Tablet.png">
                <img src="assets/images/Desktop.png" alt="Screen with Efficiency" class="browse__image">
            </picture>
        </section>
    </main>
</body>
</html>
